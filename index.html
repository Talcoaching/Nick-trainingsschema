<!doctype html><html lang="nl"><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Nick | tal&amp;coaching</title><style>*{box-sizing:border-box}body{margin:0;background:#fdfbf3;color:#2d4a3e;font:15px system-ui}header{background:#2d4a3e;color:white;padding:20px;border-bottom:4px solid #c97b1a}main{max-width:720px;margin:auto;padding:14px}button,input{font:inherit}button{border:1px solid #ddd8cc;border-radius:9px;padding:10px;background:white;color:#2d4a3e;cursor:pointer}button.active{background:#2d4a3e;color:white}nav{display:flex;gap:6px;overflow:auto;margin:10px 0}nav button{flex:1;white-space:nowrap}article{background:white;border:1px solid #ddd8cc;border-radius:12px;padding:14px;margin:12px 0}h2,h3{margin:0 0 8px}small{color:#2a7a8c} .line{display:grid;grid-template-columns:30px repeat(3,minmax(0,1fr));gap:6px;margin:6px 0;align-items:center}input{width:100%;padding:8px 4px;border:1px solid #ddd8cc;border-radius:7px;text-align:center;background:#fdfbf3}input::placeholder{color:#aaa}textarea{width:100%;min-height:70px;border:1px solid #ddd8cc;border-radius:8px;padding:10px;font:inherit}footer{padding:10px;color:#65766c}</style><header><strong>tal&amp;coaching</strong><h2>Nick — Trainingsschema</h2>2 dagen per week · Core strength &amp; stability</header><main><nav id="days"></nav><nav id="weeks"></nav><div id="content"></div><footer>Registratie wordt lokaal opgeslagen op dit apparaat. Grijze waarden zijn die van de vorige week.</footer></main><script>
const schema=[[['Bench Press',3,'8–10'],['Contralateral Bulgarian Split Squat',2,'8–10 per been','reps','Houd de dumbbell tegenover het werkende been.'],['Seated Cable Row',2,'10–12'],['Lying Leg Curl',2,'10–15'],['Farmer Walk',2,'30 meter','m'],['Plank',2,'20–40 sec','sec'],['Side Plank',2,'20–30 sec per kant','sec']],[['Standing DB Overhead Press',3,'8–10'],['Romanian Deadlift',2,'8–10'],['Lat Pulldown',2,'10–12'],['Leg Press',2,'10–12'],['Suitcase Carry',2,'20–30 m per kant','m'],['Pallof Press',2,'10–12 per kant'],['Landmine Rotation',2,'8–10 per kant']]];let day=0,week=1;const key=(w,e,s,t)=>`nick-v1-${day}-${w}-${e}-${s}-${t}`;function get(k){try{return localStorage.getItem(k)||''}catch{return ''}}function put(k,v){try{localStorage.setItem(k,v)}catch{document.getElementById('status').textContent='Opslag niet beschikbaar'}}function render(){const days=document.getElementById('days'),weeks=document.getElementById('weeks'),c=document.getElementById('content');days.replaceChildren();weeks.replaceChildren();c.replaceChildren();function btn(parent,label,active,fn){let b=document.createElement('button');b.textContent=label;b.className=active?'active':'';b.onclick=fn;parent.append(b)}['Dag A','Dag B'].forEach((n,i)=>btn(days,n,day===i,()=>{day=i;render()}));for(let i=1;i<=8;i++)btn(weeks,'W'+i,week===i,()=>{week=i;render()});let rir=week<=2?'3–4':week<=4?'2–3':'1–2';c.innerHTML=`<h2>${day===0?'Full Body + Core Stability':'Full Body + Rotational Strength'}</h2><p>Week ${week} · RIR ${rir}</p><small>Verhoog eerst herhalingen, tijd of afstand binnen de richtlijn. Verhoog daarna de weerstand als de techniek goed blijft. Voeg geen sets toe zolang je vooruitgaat.</small>`;schema[day].forEach(([name,sets,reps,unit='reps',note=''],e)=>{let a=document.createElement('article');a.innerHTML=`<h3>${name}</h3><small>${sets} × ${reps}${note?' · '+note:''}</small><div class="line"><small>Set</small><small>Kg</small><small>${unit}</small><small>${unit==='reps'?'RIR':'Controle'}</small></div>`;for(let s=0;s<sets;s++){let row=document.createElement('div');row.className='line';row.textContent=s+1;['kg','result','rir'].forEach(t=>{let i=document.createElement('input');i.setAttribute('aria-label',`${name} set ${s+1} ${t}`);i.value=get(key(week,e,s,t));i.placeholder=week>1?get(key(week-1,e,s,t))||'–':'–';i.oninput=()=>put(key(week,e,s,t),i.value);row.append(i)});a.append(row)}c.append(a)});let a=document.createElement('article');a.innerHTML='<h3>Notities</h3><textarea aria-label="Notities"></textarea><p id="status">Automatisch lokaal opgeslagen</p>';let t=a.querySelector('textarea');t.value=get(key(week,'notes',0,'text'));t.oninput=()=>put(key(week,'notes',0,'text'),t.value);c.append(a)}render();</script></html>
